<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iDOrs</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#eef2f7;color:#182233}.app{height:100vh;max-width:1100px;margin:auto;display:grid;grid-template-columns:280px 1fr;background:#fff}.side{border-right:1px solid #ddd;background:#f7f9fc}.brand{font-size:25px;font-weight:800;padding:22px}.status{margin:0 16px 16px;padding:10px;border-radius:10px;background:#e7edf5;font-size:12px}.peer{padding:15px 18px;border-top:1px solid #e5e8ed;cursor:pointer}.peer.active{background:#deedff}.chat{display:grid;grid-template-rows:auto 1fr auto}.head{padding:17px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.messages{padding:22px;overflow:auto;background:#f3f6fa}.msg{width:max-content;max-width:70%;padding:10px 13px;border-radius:14px;background:#fff;margin:7px 0;box-shadow:0 1px 2px #0001}.mine{margin-left:auto;background:#dcebff}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid #ddd}.composer input{flex:1;padding:13px;border:1px solid #ccd3dd;border-radius:12px}.composer button{padding:0 20px;border:0;border-radius:12px;background:#1683ff;color:white;font-weight:700}@media(max-width:650px){.app{grid-template-columns:1fr}.side{display:none}}</style></head><body><div class="app"><aside class="side"><div class="brand">iDOrs</div><div id="status" class="status">Connecting…</div><div id="peers"></div></aside><main class="chat"><header class="head"><strong id="title">Direct chat</strong><span id="state">Offline</span></header><section id="messages" class="messages"></section><form id="form" class="composer"><input id="input" placeholder="Write a message…" autocomplete="off"><button>Send</button></form></main></div><script>const SIGNALING_URL="wss://idors.onrender.com";
const ws=new WebSocket(SIGNALING_URL);const peers=new Map();let myId,selected;const $=x=>document.getElementById(x),add=(t,m)=>{const e=document.createElement("div");e.className="msg"+(m?" mine":"");e.textContent=t;$("messages").append(e);$("messages").scrollTop=99999};async function connect(id,offerer){const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});const s={pc,channel:null};peers.set(id,s);pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:"signal",to:id,data:{candidate:e.candidate}}));pc.onconnectionstatechange=()=>$("state").textContent=pc.connectionState;const attach=c=>{s.channel=c;c.onopen=()=>$("state").textContent="Connected";c.onmessage=e=>add(e.data,false)};if(offerer){attach(pc.createDataChannel("idors-chat"));await pc.setLocalDescription(await pc.createOffer());ws.send(JSON.stringify({type:"signal",to:id,data:{description:pc.localDescription}}))}else pc.ondatachannel=e=>attach(e.channel);return s}ws.onopen=()=>$("status").textContent="Signaling connected";ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==="welcome"){myId=m.peerId;$("status").textContent="Online · "+myId.slice(0,8)}if(m.type==="peer"){if(!peers.has(m.peerId))await connect(m.peerId,myId<m.peerId);const p=document.createElement("div");p.className="peer";p.textContent="Peer "+m.peerId.slice(0,8);p.onclick=()=>{selected=m.peerId;$("title").textContent=p.textContent;document.querySelectorAll(".peer").forEach(x=>x.classList.remove("active"));p.classList.add("active")};$("peers").append(p)}if(m.type==="signal"){let s=peers.get(m.from)||await connect(m.from,false);if(m.data.description){await s.pc.setRemoteDescription(m.data.description);if(m.data.description.type==="offer"){await s.pc.setLocalDescription(await s.pc.createAnswer());ws.send(JSON.stringify({type:"signal",to:m.from,data:{description:s.pc.localDescription}}))}}if(m.data.candidate)try{await s.pc.addIceCandidate(m.data.candidate)}catch{}}};$("form").onsubmit=e=>{e.preventDefault();const t=$("input").value.trim(),c=peers.get(selected)?.channel;if(!t||!c||c.readyState!=="open")return;c.send(t);add(t,true);$("input").value=""}</script></body></html>
