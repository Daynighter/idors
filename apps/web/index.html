<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iDors</title>
<style>
*{box-sizing:border-box}
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#090611}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{position:relative;background:radial-gradient(circle at 12% 15%,#6d28d955 0,transparent 28%),radial-gradient(circle at 88% 18%,#a855f744 0,transparent 30%),radial-gradient(circle at 50% 100%,#7e22ce42 0,transparent 35%),#090611}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.7;animation:float 13s ease-in-out infinite alternate}
body:before{width:300px;height:300px;background:#8b5cf6;left:-90px;top:45%}
body:after{width:260px;height:260px;background:#c026d3;right:-70px;bottom:8%;animation-delay:-4s}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(30px,-22px,0) scale(1.1)}}
.app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:290px 1fr;overflow:hidden;background:transparent}
.sidebar{padding:18px;background:transparent;display:flex;flex-direction:column;gap:14px}
.brand{padding:8px 10px;font-size:27px;font-weight:800;letter-spacing:-1px}
.connection{height:58px;padding:0 17px;display:flex;align-items:center;gap:10px;border:1px solid #ffffff13;border-radius:20px;background:#ffffff09;box-shadow:0 12px 35px #0002;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.loader{width:15px;height:15px;border:2px solid #ffffff20;border-top-color:#c084fc;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.peers{overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;padding:2px}
.peer{padding:13px;border:1px solid #ffffff12;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:12px;background:#ffffff08;box-shadow:0 10px 28px #00018;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:.2s}
.peer:hover,.peer.active{background:#ffffff12;border-color:#ffffff20;transform:translateY(-1px)}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#a855f7,#6d28d9);box-shadow:0 8px 25px #7c3aed44;color:#fff;font-weight:800}
.peer-name{font-weight:650}.peer-state{font-size:11px;color:#b8acc8;margin-top:3px}.peer-check{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#ffffff0b;color:#a855f7;opacity:0;transition:.2s}.peer.active .peer-check{opacity:1}
.chat{position:relative;display:grid;grid-template-rows:76px 1fr 84px;min-width:0;background:transparent}
.head{margin:14px 18px 0;padding:0 18px;border:1px solid #ffffff12;border-radius:22px;display:flex;align-items:center;gap:12px;background:#ffffff08;box-shadow:0 12px 35px #0002;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.head-info{min-width:0}.title{font-weight:750}.subtitle{font-size:12px;color:#a99bb9;margin-top:2px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#6b6175;box-shadow:0 0 0 4px #ffffff06}.status-dot.online{background:#c084fc;box-shadow:0 0 14px #c084fc}
.messages{padding:32px 28px;overflow:auto;background:transparent;scroll-behavior:smooth}
.empty{height:100%;display:grid;place-items:center;color:#86788f;font-size:13px;text-align:center}
.msg{width:max-content;max-width:min(70%,560px);padding:11px 15px;border-radius:20px;background:#ffffff0d;border:1px solid #ffffff0e;margin:9px 0;box-shadow:0 8px 28px #00018;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);line-height:1.45}
.mine{margin-left:auto;background:linear-gradient(135deg,#7c3aedd9,#a855f7d1);border-color:#ffffff18;box-shadow:0 10px 30px #7c3aed35}
.time{font-size:10px;color:#ddd0e6;opacity:.6;margin-top:4px;text-align:right}
.composer{margin:0 18px 18px;padding:10px;border:1px solid #ffffff14;border-radius:24px;background:#ffffff0a;box-shadow:0 14px 40px #00025;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);display:flex;gap:8px}
.composer input{flex:1;min-width:0;padding:13px 16px;border:0;outline:none;background:transparent;color:#fff;font-size:15px}
.composer input::placeholder{color:#91849e}.composer input:focus{outline:none}
.composer button{border:0;border-radius:18px;padding:0 20px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:750;cursor:pointer;box-shadow:0 7px 22px #7c3aed40;transition:.2s}
.composer button:hover{transform:scale(1.02)}
.composer button:disabled,.composer input:disabled{opacity:.4;cursor:not-allowed}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:99px}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.head{margin:10px 10px 0}.composer{margin:0 10px 10px}.messages{padding:24px 16px}}
.auth{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#090611cc;backdrop-filter:blur(30px)}.auth-box{width:min(380px,calc(100% - 32px));padding:28px;border:1px solid #ffffff16;border-radius:28px;background:#ffffff0b;box-shadow:0 25px 80px #0005}.auth-box h1{margin:0 0 8px}.auth-box p{color:#a99bb9;font-size:13px}.auth-box input{width:100%;margin:7px 0;padding:14px;border:1px solid #ffffff15;border-radius:16px;background:#ffffff0a;color:#fff;outline:none}.auth-box button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:16px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:700}.auth-switch{text-align:center;color:#b9a9c8;font-size:12px;margin-top:14px;cursor:pointer}</style>
</head>
<body><div id="auth" class="auth"><div class="auth-box"><h1>iDors</h1><p id="authText">Sign in to your account</p><div id="authError" style="min-height:18px;color:#f0b4ff;font-size:12px"></div><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="authBtn">Sign in</button><div id="authSwitch" class="auth-switch">Create an account</div></div></div>
<div class="app">
<aside class="sidebar">
  <div class="brand">iDOrs</div>
  <div class="connection" aria-label="Connection status"><span id="loader" class="loader"></span></div>
  <div id="peers" class="peers"></div>
</aside>
<main class="chat">
  <header class="head">
    <span id="dot" class="status-dot"></span>
    <div class="head-info">
      <div id="title" class="title">Direct chat</div>
      <div id="subtitle" class="subtitle">Waiting for a peer</div>
    </div>
  </header>
  <section id="messages" class="messages">
    <div id="empty" class="empty">Waiting for a peer connection…</div>
  </section>
  <form id="form" class="composer">
    <input id="input" placeholder="Write a message…" autocomplete="off" disabled>
    <button id="send" disabled>Send</button>
  </form>
</main>
</div>
<script>
const SIGNALING_URL="wss://idors.onrender.com";
const $=id=>document.getElementById(id);
let registerMode=false;
let ws=null;
let myId=localStorage.getItem("idors:peer-id")||crypto.randomUUID();
localStorage.setItem("idors:peer-id",myId);
let selected=null;
const peers=new Map();
const peerElements=new Map();
const chats=new Map();

function setConnected(connected){
  $("loader").style.display=connected?"none":"block";
  $("dot").classList.toggle("online",connected);
}
function timeNow(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function saveChats(){const serial={};for(const [id,list] of chats)serial[id]=list;localStorage.setItem("idors:chats",JSON.stringify(serial));}
function loadChats(){try{const s=JSON.parse(localStorage.getItem("idors:chats")||"{}");for(const [id,list] of Object.entries(s))if(Array.isArray(list))chats.set(id,list);}catch{}}
loadChats();

function addMessage(text,mine=false,time=timeNow()){
  $("empty")?.remove();
  const wrap=document.createElement("div"); wrap.className="msg"+(mine?" mine":"");
  const body=document.createElement("div"); body.textContent=text;
  const stamp=document.createElement("div"); stamp.className="time"; stamp.textContent=time;
  wrap.append(body,stamp); $("messages").append(wrap); $("messages").scrollTop=$("messages").scrollHeight;
}
function renderChat(id){
  $("messages").innerHTML="";
  const list=chats.get(id)||[];
  if(!list.length){const e=document.createElement("div");e.id="empty";e.className="empty";e.textContent="No messages yet";$("messages").append(e);return;}
  for(const m of list)addMessage(m.text,m.mine,m.time);
}
function updateComposer(){
  const ch=selected?peers.get(selected)?.channel:null;
  const ready=ch?.readyState==="open";
  $("input").disabled=!ready;$("send").disabled=!ready;
  $("subtitle").textContent=ready?"Connected":"Connecting…";
  $("dot").classList.toggle("online",!!ready);
}
function createPeerElement(id,label){
  if(peerElements.has(id))return peerElements.get(id);
  const row=document.createElement("div");row.className="peer";row.dataset.peer=id;
  row.innerHTML='<div class="avatar">P</div><div><div class="peer-name"></div><div class="peer-state">Connecting…</div></div><span class="peer-check">✓</span>';
  row.querySelector(".peer-name").textContent=label||"Peer "+id.slice(0,8);
  row.onclick=()=>selectPeer(id);$("peers").append(row);peerElements.set(id,row);return row;
}
function selectPeer(id){
  if(!peers.has(id))return;
  selected=id;document.querySelectorAll(".peer").forEach(x=>x.classList.toggle("active",x.dataset.peer===id));
  $("title").textContent=peerElements.get(id)?.querySelector(".peer-name")?.textContent||"Direct chat";
  renderChat(id);updateComposer();
}
function updatePeerUI(id,state){peerElements.get(id)?.querySelector(".peer-state")?.replaceChildren(document.createTextNode(state));}
function removePeer(id){
  const s=peers.get(id);try{s?.channel?.close();s?.pc?.close();}catch{}
  peers.delete(id);peerElements.get(id)?.remove();peerElements.delete(id);
  if(selected===id){selected=null;$("title").textContent="Direct chat";$("subtitle").textContent="Waiting for a peer";updateComposer();}
}

async function connectPeer(id,offerer){
  if(peers.has(id))return peers.get(id);
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]});
  const state={pc,channel:null};peers.set(id,state);chats.set(id,chats.get(id)||[]);createPeerElement(id);
  pc.onicecandidate=e=>{if(e.candidate&&ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"signal",to:id,data:{candidate:e.candidate}}));};
  pc.onconnectionstatechange=()=>{const s=pc.connectionState;updatePeerUI(id,s==="connected"?"Connected":s==="connecting"?"Connecting…":"Disconnected");if(selected===id)updateComposer();};
  const attach=channel=>{
    state.channel=channel;
    channel.onopen=()=>{updatePeerUI(id,"Connected");if(!selected)selectPeer(id);updateComposer();};
    channel.onclose=()=>{updatePeerUI(id,"Disconnected");updateComposer();};
    channel.onerror=()=>updatePeerUI(id,"Connection error");
    channel.onmessage=e=>{const m={text:e.data,mine:false,time:timeNow()};chats.get(id).push(m);saveChats();if(selected===id)addMessage(m.text,false,m.time);};
  };
  if(offerer){attach(pc.createDataChannel("idors-chat"));await pc.setLocalDescription(await pc.createOffer());ws.send(JSON.stringify({type:"signal",to:id,data:{description:pc.localDescription}}));}
  else pc.ondatachannel=e=>attach(e.channel);
  return state;
}

async function loadMe(){
  const r=await fetch("/api/me",{credentials:"same-origin"});
  if(!r.ok)throw new Error("not-authenticated");
  const d=await r.json(),p=d.profile;
  if(p){
    $("authText").textContent="Cuenta: @"+p.username;
    $("authError").textContent=p.peer_code?"ID: "+p.peer_code:"";
  }
  return p;
}
async function authenticate(){
  const username=$("username").value.trim(),password=$("password").value;
  $("authError").textContent="";
  if(!username||!password){$("authError").textContent="Completa usuario y contraseña.";return;}
  const endpoint=registerMode?"/api/register":"/api/login";
  try{
    const r=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify({username,password})});
    const d=await r.json();
    if(!d.ok){$("authError").textContent=d.error==="exists"?"Ese usuario ya existe.":d.error==="invalid"?"Usuario o contraseña no válidos.":"No se pudo completar la operación.";return;}
    $("auth").remove();
    await startSocket();
  }catch(e){$("authError").textContent="No se pudo conectar con el servidor.";}
}
$("authBtn").onclick=authenticate;
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")authenticate();});
$("authSwitch").onclick=()=>{registerMode=!registerMode;$("authText").textContent=registerMode?"Create your account":"Sign in to your account";$("authBtn").textContent=registerMode?"Create account":"Sign in";$("authSwitch").textContent=registerMode?"I already have an account":"Create an account";$("authError").textContent="";};

async function startSocket(){
  try{const p=await loadMe(); if(p?.peer_code)$("subtitle").textContent="Tu ID "+p.peer_code;}catch{}
  ws=new WebSocket(SIGNALING_URL);
  ws.onopen=()=>{setConnected(true);};
  ws.onclose=()=>{setConnected(false);$("subtitle").textContent="Reconnecting…";setTimeout(()=>location.reload(),3000);};
  ws.onerror=()=>setConnected(false);
  ws.onmessage=async event=>{
    let m;try{m=JSON.parse(event.data)}catch{return}
    if(m.type==="auth-ok"){ws.send(JSON.stringify({type:"register",peerId:myId}));return;}
    if(m.type==="already-online"){alert("Esta cuenta ya está conectada en otro navegador.");ws.close();return;}
    if(m.type==="welcome"){myId=m.peerId;localStorage.setItem("idors:peer-id",myId);return;}
    if(m.type==="peer"){if(m.peerId!==myId){createPeerElement(m.peerId);if(!peers.has(m.peerId))await connectPeer(m.peerId,myId<m.peerId);}}
    if(m.type==="peer-left")removePeer(m.peerId);
    if(m.type==="signal"){
      let state=peers.get(m.from);if(!state)state=await connectPeer(m.from,false);
      if(m.data?.description){await state.pc.setRemoteDescription(m.data.description);if(m.data.description.type==="offer"){await state.pc.setLocalDescription(await state.pc.createAnswer());ws.send(JSON.stringify({type:"signal",to:m.from,data:{description:state.pc.localDescription}}));}}
      if(m.data?.candidate)try{await state.pc.addIceCandidate(m.data.candidate)}catch{}
    }
  };
}

$("form").onsubmit=event=>{
  event.preventDefault();
  const text=$("input").value.trim(),channel=selected?peers.get(selected)?.channel:null;
  if(!text||!channel||channel.readyState!=="open")return;
  channel.send(text);const m={text,mine:true,time:timeNow()};chats.get(selected).push(m);saveChats();addMessage(m.text,true,m.time);$("input").value="";$("input").focus();
};

(async()=>{
  try{await loadMe();$("auth").remove();await startSocket();}
  catch{$("auth").style.display="grid";}
})();
</script>
</body>
</html>
<script>/* iDOrs authentication is required before WebRTC signaling. */</script>
