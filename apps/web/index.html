<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iDOrs</title>
<style>
*{box-sizing:border-box}
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#090611}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{position:relative;background:radial-gradient(circle at 15% 15%,#5b21b655 0,transparent 28%),radial-gradient(circle at 85% 20%,#9333ea44 0,transparent 30%),radial-gradient(circle at 50% 100%,#7e22ce3d 0,transparent 34%),#090611}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(65px);pointer-events:none;opacity:.7;animation:float 12s ease-in-out infinite alternate}
body:before{width:320px;height:320px;background:#8b5cf6;left:-100px;top:45%}
body:after{width:280px;height:280px;background:#c026d3;right:-80px;bottom:8%;animation-delay:-4s}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(35px,-25px,0) scale(1.12)}}
.app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:300px 1fr;overflow:hidden;background:transparent}
.sidebar{border-right:1px solid #ffffff14;background:#ffffff08;backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);display:flex;flex-direction:column}
.brand{padding:25px 24px;font-size:27px;font-weight:800;letter-spacing:-1px;color:#fff}
.connection{height:38px;display:flex;align-items:center;padding:0 24px;color:#bbaed1}
.loader{width:16px;height:16px;border:2px solid #ffffff20;border-top-color:#c084fc;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.peers{overflow:auto;flex:1;padding:10px 8px}
.peer{padding:13px 14px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s;background:transparent}
.peer:hover,.peer.active{background:#ffffff10}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#a855f7,#6d28d9);box-shadow:0 8px 28px #7c3aed44;color:#fff;font-weight:800}
.peer-name{font-weight:650}.peer-state{font-size:11px;color:#b8acc8;margin-top:2px}
.chat{position:relative;display:grid;grid-template-rows:72px 1fr 76px;min-width:0;background:transparent}
.head{padding:0 26px;border-bottom:1px solid #ffffff10;display:flex;align-items:center;gap:12px;background:#ffffff05;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.head-info{min-width:0}.title{font-weight:750}.subtitle{font-size:12px;color:#a99bb9;margin-top:2px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#6b6175;box-shadow:0 0 0 4px #ffffff06}.status-dot.online{background:#c084fc;box-shadow:0 0 14px #c084fc}
.messages{padding:28px;overflow:auto;background:transparent;scroll-behavior:smooth}
.empty{height:100%;display:grid;place-items:center;color:#86788f;font-size:13px;text-align:center}
.msg{width:max-content;max-width:min(70%,560px);padding:11px 14px;border-radius:18px;background:#ffffff0d;border:1px solid #ffffff10;margin:8px 0;box-shadow:0 8px 30px #0002;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);line-height:1.45}
.mine{margin-left:auto;background:linear-gradient(135deg,#7c3aedcc,#a855f7c7);border-color:#ffffff18;box-shadow:0 10px 32px #7c3aed35}
.time{font-size:10px;color:#ddd0e6;opacity:.6;margin-top:4px;text-align:right}
.composer{display:flex;gap:10px;padding:13px 18px;border-top:1px solid #ffffff10;background:#ffffff06;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.composer input{flex:1;min-width:0;padding:14px 17px;border:1px solid #ffffff14;border-radius:18px;outline:none;background:#ffffff0b;color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.composer input::placeholder{color:#8e819a}.composer input:focus{border-color:#a855f766;box-shadow:0 0 0 3px #a855f71a}
.composer button{border:1px solid #ffffff16;border-radius:18px;padding:0 22px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:750;cursor:pointer;box-shadow:0 8px 26px #7c3aed44;transition:.2s}
.composer button:hover{transform:translateY(-1px);box-shadow:0 12px 32px #7c3aed5c}
.composer button:disabled,.composer input:disabled{opacity:.4;cursor:not-allowed}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:99px}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">iDOrs</div>
  <div class="connection" aria-label="Connection status"><span id="loader" class="loader"></span></div>
  <div id="peers" class="peers"></div>
</aside>
<main class="chat">
  <header class="head">
    <span id="dot" class="status-dot"></span>
    <div class="head-info">
      <div id="title" class="title">Direct chat</div>
      <div id="subtitle" class="subtitle">Waiting for a peer</div>
    </div>
  </header>
  <section id="messages" class="messages">
    <div id="empty" class="empty">Waiting for a peer connection…</div>
  </section>
  <form id="form" class="composer">
    <input id="input" placeholder="Write a message…" autocomplete="off" disabled>
    <button id="send" disabled>Send</button>
  </form>
</main>
</div>
<script>
const SIGNALING_URL="wss://idors.onrender.com";
const ws=new WebSocket(SIGNALING_URL);
const peers=new Map();
const peerElements=new Map();
let myId=null;
let selected=null;

const $=id=>document.getElementById(id);

function setConnected(connected){
  $("loader").style.display=connected?"none":"block";
  $("dot").classList.toggle("online",connected);
}

function timeNow(){
  return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}

function addMessage(text,mine=false){
  $("empty")?.remove();
  const wrap=document.createElement("div");
  wrap.className="msg"+(mine?" mine":"");
  const body=document.createElement("div");
  body.textContent=text;
  const time=document.createElement("div");
  time.className="time";
  time.textContent=timeNow();
  wrap.append(body,time);
  $("messages").append(wrap);
  $("messages").scrollTop=$("messages").scrollHeight;
}

function updateComposer(){
  const channel=selected?peers.get(selected)?.channel:null;
  const ready=channel?.readyState==="open";
  $("input").disabled=!ready;
  $("send").disabled=!ready;
  $("subtitle").textContent=ready?"Connected":"Connecting…";
  $("dot").classList.toggle("online",!!ready);
}

function createPeerElement(id){
  if(peerElements.has(id))return peerElements.get(id);
  const row=document.createElement("div");
  row.className="peer";
  row.dataset.peer=id;
  row.innerHTML='<div class="avatar">P</div><div><div class="peer-name">Peer '+id.slice(0,8)+'</div><div class="peer-state">Connecting…</div></div>';
  row.onclick=()=>{
    selected=id;
    document.querySelectorAll(".peer").forEach(x=>x.classList.remove("active"));
    row.classList.add("active");
    $("title").textContent="Peer "+id.slice(0,8);
    updateComposer();
  };
  $("peers").append(row);
  peerElements.set(id,row);
  return row;
}

function updatePeerUI(id,state){
  const row=peerElements.get(id);
  if(!row)return;
  row.querySelector(".peer-state").textContent=state;
}

async function connectPeer(id,offerer){
  if(peers.has(id))return peers.get(id);
  const pc=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });
  const state={pc,channel:null};
  peers.set(id,state);
  createPeerElement(id);

  pc.onicecandidate=e=>{
    if(e.candidate&&ws.readyState===WebSocket.OPEN){
      ws.send(JSON.stringify({type:"signal",to:id,data:{candidate:e.candidate}}));
    }
  };

  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    updatePeerUI(id,s==="connected"?"Connected":s==="connecting"?"Connecting…":"Disconnected");
    if(selected===id)updateComposer();
  };

  const attach=channel=>{
    state.channel=channel;
    channel.onopen=()=>{
      updatePeerUI(id,"Connected");
      if(!selected){
        selected=id;
        createPeerElement(id).classList.add("active");
        $("title").textContent="Peer "+id.slice(0,8);
      }
      updateComposer();
    };
    channel.onclose=()=>{
      updatePeerUI(id,"Disconnected");
      updateComposer();
    };
    channel.onerror=()=>updatePeerUI(id,"Connection error");
    channel.onmessage=e=>addMessage(e.data,false);
  };

  if(offerer){
    attach(pc.createDataChannel("idors-chat"));
    await pc.setLocalDescription(await pc.createOffer());
    ws.send(JSON.stringify({type:"signal",to:id,data:{description:pc.localDescription}}));
  }else{
    pc.ondatachannel=e=>attach(e.channel);
  }
  return state;
}

ws.onopen=()=>{
  setConnected(true);
};

ws.onclose=()=>{
  setConnected(false);
  $("subtitle").textContent="Reconnecting…";
  setTimeout(()=>location.reload(),3000);
};

ws.onerror=()=>setConnected(false);

ws.onmessage=async event=>{
  let m;
  try{m=JSON.parse(event.data)}catch{return}

  if(m.type==="welcome"){
    myId=m.peerId;
    return;
  }

  if(m.type==="peer"){
    const id=m.peerId;
    if(id===myId)return;
    createPeerElement(id);
    if(!peers.has(id)){
      await connectPeer(id,myId<id);
    }
    return;
  }

  if(m.type==="peer-left"){
    const row=peerElements.get(m.peerId);
    row?.remove();
    peerElements.delete(m.peerId);
    peers.delete(m.peerId);
    if(selected===m.peerId){
      selected=null;
      $("title").textContent="Direct chat";
      $("subtitle").textContent="Waiting for a peer";
      updateComposer();
    }
    return;
  }

  if(m.type==="signal"){
    let state=peers.get(m.from);
    if(!state)state=await connectPeer(m.from,false);

    if(m.data?.description){
      await state.pc.setRemoteDescription(m.data.description);
      if(m.data.description.type==="offer"){
        await state.pc.setLocalDescription(await state.pc.createAnswer());
        ws.send(JSON.stringify({type:"signal",to:m.from,data:{description:state.pc.localDescription}}));
      }
    }

    if(m.data?.candidate){
      try{await state.pc.addIceCandidate(m.data.candidate)}catch{}
    }
  }
};

$("form").onsubmit=event=>{
  event.preventDefault();
  const text=$("input").value.trim();
  const channel=selected?peers.get(selected)?.channel:null;
  if(!text||!channel||channel.readyState!=="open")return;
  channel.send(text);
  addMessage(text,true);
  $("input").value="";
  $("input").focus();
};
</script>
</body>
</html>
